schema_version: "1.1"
name: trigger-blender
description: A Blender art request should reach the assets skill.
tags: [trigger]
execution:
  prompt: "this model needs to look better in Blender"
  max_turns: 3
  timeout_seconds: 120
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 3
graders:
  - type: tool_used
    name: loads-the-skill
    tool: Skill
    input_match: "moonbrick:assets"
