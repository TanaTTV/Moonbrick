schema_version: "1.1"
name: trigger-lobby
description: A level request should reach the level guidance.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "design a lobby level for my obby"
  max_turns: 3
  timeout_seconds: 120
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 3
graders:
  - type: tool_used
    name: loads-the-skill
    tool: Skill
    input_match: "moonbrick:(level-design|game-design)"
