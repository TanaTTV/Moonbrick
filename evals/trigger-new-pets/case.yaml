schema_version: "1.1"
name: trigger-new-pets
description: A plain new-game request should reach the new skill.
tags: [trigger]
execution:
  prompt: "make a Roblox game about pets"
  max_turns: 3
  timeout_seconds: 120
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 3
graders:
  - type: tool_used
    name: loads-the-skill
    tool: Skill
    input_match: "moonbrick:new"
