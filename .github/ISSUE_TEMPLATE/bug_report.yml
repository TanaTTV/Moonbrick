name: Bug report
description: Something in Moonbrick didn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you asked Claude to do, what happened, and what you expected.
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Output / logs
      description: Paste `tools/check.sh` output, `K.logs()`, or the error Claude showed.
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Moonbrick version (`claude plugin list`), Rojo version.
      placeholder: "Windows 11 / macOS 15, Moonbrick 1.0.0, Rojo 7.7.1"
    validations: { required: true }
  - type: input
    id: studio
    attributes:
      label: Roblox Studio version
      description: Studio → File → About Roblox Studio.
      placeholder: "0.743.0.7431133"
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - Marketplace (/plugin marketplace add TanaTTV/Moonbrick)
        - Local checkout (claude plugin marketplace add <path>)
    validations: { required: true }
