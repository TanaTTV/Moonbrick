name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Per event: a push run and its pull_request run must not cancel each other (shows as failed checks).
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  stability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Host regression tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s scripts/bench -p test_harness.py
      - name: Install verified development tools
        env:
          # Unauthenticated GitHub API calls hit the shared runner rate limit (403) and fail the install.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/fetch-luau.py
          python scripts/fetch-rokit.py
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit authenticate github --token "$GITHUB_TOKEN" --skip-verify
          cd template
          rokit install --no-trust-check
      - name: Check Luau formatting
        run: |
          export PATH="$HOME/.rokit/bin:$PATH"
          cd template
          stylua --check --config-path stylua.toml ../luau ../tests/headless.luau
      - name: Headless persistence regressions
        run: |
          exe=.artifacts/tools/luau/luau
          if [ "$RUNNER_OS" = Windows ]; then exe="$exe.exe"; fi
          python scripts/test-luau.py --luau "$exe"
          # Memory-store run of the live DataStore acceptance harness; also fails if its PlayerData copy drifted.
          python acceptance/datastore/run-headless.py --luau "$exe"
      - name: Strict DataStore acceptance analysis, lint and formatting
        run: |
          export PATH="$HOME/.rokit/bin:$PATH"
          cd acceptance/datastore
          curl -fsSL --connect-timeout 10 --max-time 60 -o globalTypes.d.luau \
            https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/0382dc76ca9b73df3c8e7c9cd85a8dd493cbd0ae/scripts/globalTypes.PluginSecurity.d.luau
          echo "e441a5cefd41d05649e14659b5bc23147bb1637b91ff86b04cbf1f45d8a4573c  globalTypes.d.luau" | sha256sum -c -
          rojo sourcemap default.project.json -o sourcemap.json
          # Some analyzer diagnostics can accompany exit 0; require empty source output too.
          luau_status=0
          luau-lsp analyze --sourcemap=sourcemap.json --definitions=globalTypes.d.luau --formatter=plain src tests \
            > "$RUNNER_TEMP/datastore-analysis.txt" 2>&1 || luau_status=$?
          cat "$RUNNER_TEMP/datastore-analysis.txt"
          test "$luau_status" -eq 0
          diagnostics=$(grep -vE '^\[(INFO|WARN)\]|^Results:|^[0-9]+ (errors|warnings|parse errors)|^[[:space:]]*$' \
            "$RUNNER_TEMP/datastore-analysis.txt" || true)
          test -z "$diagnostics"
          selene --display-style=quiet src tests
          # Generated factory is checked byte-for-byte by run-headless.py; preserve the shipped body.
          find src tests -type f -name '*.luau' ! -name 'PlayerDataFactory.luau' -print0 \
            | xargs -0 stylua --check --config-path ../../template/stylua.toml
      - name: Scaffold, check and build
        env:
          GIT_AUTHOR_NAME: Moonbrick CI
          GIT_AUTHOR_EMAIL: ci@moonbrick.invalid
          GIT_COMMITTER_NAME: Moonbrick CI
          GIT_COMMITTER_EMAIL: ci@moonbrick.invalid
        run: |
          export PATH="$HOME/.rokit/bin:$PATH"
          bash scripts/new-project.sh .artifacts/ci-game ci-game --no-tools
          cd .artifacts/ci-game
          bash tools/check.sh
          rojo build default.project.json -o smoke.rbxlx
          cd ../..
          bash scripts/check-recipes.sh .artifacts/ci-recipes
      - name: Real Rojo import and server integration
        run: python scripts/test-integration.py
      - name: Real Rojo import fidelity (large/UI/rig/world, .rbxlx + .rbxl)
        timeout-minutes: 3
        run: |
          export PATH="$HOME/.rokit/bin:$PATH"
          python scripts/test-import-fidelity.py
      - name: Original checker regression and 0.1 project upgrade
        run: |
          python scripts/prove-checker-fix.py
          python scripts/test-upgrade.py
  install:
    # Fresh plugin install + 0.1.0 upgrade in isolated config/cache dirs (needs the v0.1.0 tag).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Isolated plugin install and upgrade acceptance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.296
          python scripts/test-install.py
  plugin:
    # The pinned version gates merges; latest is an early warning for manifest/hook format changes.
    strategy:
      fail-fast: false
      matrix:
        claude: ['2.1.296', latest]
    continue-on-error: ${{ matrix.claude == 'latest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Claude Code plugin and components
        run: |
          npx --yes "@anthropic-ai/claude-code@${{ matrix.claude }}" plugin validate --strict .
          npx --yes "@anthropic-ai/claude-code@${{ matrix.claude }}" plugin validate --strict .claude-plugin/plugin.json
          npx --yes "@anthropic-ai/claude-code@${{ matrix.claude }}" plugin validate --strict skills
  python-minimum:
    # Project scripts declare Python 3.10+; catch newer-only syntax and library use.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Host regression tests on Python 3.10
        run: python -m unittest discover -s tests -v
