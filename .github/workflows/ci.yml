name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  stability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Host regression tests
        run: python -m unittest discover -s tests -v
      - name: Install verified development tools
        run: |
          python scripts/fetch-luau.py
          python scripts/fetch-rokit.py
          export PATH="$HOME/.rokit/bin:$PATH"
          cd template
          rokit install --no-trust-check
      - name: Headless persistence regressions
        run: |
          exe=.artifacts/tools/luau/luau
          if [ "$RUNNER_OS" = Windows ]; then exe="$exe.exe"; fi
          python scripts/test-luau.py --luau "$exe"
      - name: Scaffold, check and build
        env:
          GIT_AUTHOR_NAME: Moonbrick CI
          GIT_AUTHOR_EMAIL: ci@moonbrick.invalid
          GIT_COMMITTER_NAME: Moonbrick CI
          GIT_COMMITTER_EMAIL: ci@moonbrick.invalid
        run: |
          export PATH="$HOME/.rokit/bin:$PATH"
          bash scripts/new-project.sh .artifacts/ci-game ci-game --no-tools
          cd .artifacts/ci-game
          bash tools/check.sh
          rojo build default.project.json -o smoke.rbxlx
      - name: Real Rojo import and server integration
        run: python scripts/test-integration.py
      - name: Original checker regression and 0.1 project upgrade
        run: |
          python scripts/prove-checker-fix.py
          python scripts/test-upgrade.py
      - name: Example check and build
        run: |
          export PATH="$HOME/.rokit/bin:$PATH"
          python scripts/create-example.py .artifacts/crystal-rush
          cd .artifacts/crystal-rush
          bash tools/check.sh
          rojo build default.project.json -o crystal-rush.rbxlx
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Claude Code plugin and components
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.296 plugin validate --strict .
          npx --yes @anthropic-ai/claude-code@2.1.296 plugin validate --strict .claude-plugin/plugin.json
          npx --yes @anthropic-ai/claude-code@2.1.296 plugin validate --strict skills
